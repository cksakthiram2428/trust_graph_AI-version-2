<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Graphic Node Constellation on the right -->
  <g transform="translate(850, 315)">
    <circle cx="0" cy="0" r="180" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
    <circle cx="0" cy="0" r="110" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="-110" x2="95" y2="55" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
    <line x1="95" y1="55" x2="-95" y2="55" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
    <line x1="-95" y1="55" x2="0" y2="-110" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="95" y2="55" stroke="#818CF8" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-95" y2="55" stroke="#34D399" stroke-width="2.5"/>
    
    <circle cx="0" cy="-110" r="14" fill="#38BDF8"/>
    <circle cx="95" cy="55" r="14" fill="#818CF8"/>
    <circle cx="-95" cy="55" r="14" fill="#34D399"/>
    <circle cx="0" cy="0" r="22" fill="#22D3EE"/>
    <circle cx="0" cy="0" r="10" fill="#0A0A0C"/>
  </g>

  <!-- Left Text and Branding -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="310" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)"/>
    <text x="18" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="2">
      MSME RESILIENCE ENGINE
    </text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      TrustGraph <tspan fill="url(#cyanGrad)">AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94A3B8">
      3D Supply Chain Knowledge Graph & Contagion Simulator
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="180" height="42" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0">
        Udyam Verified
      </text>

      <rect x="195" y="0" width="190" height="42" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="215" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0">
        MSMED Act 2006
      </text>

      <rect x="400" y="0" width="170" height="42" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="420" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0">
        Gemini 3.7 AI
      </text>
    </g>

    <!-- Footer URL -->
    <text x="0" y="340" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#38BDF8">
      trustgraph.ai • Built for Indian MSME Procurement
    </text>
  </g>
</svg>
